name: Sync to GitCode

on:
  push:
    branches: master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitCode
        run: |
          git remote add gitcode https://oauth2:${{ secrets.GITCODE_TOKEN }}@gitcode.com/lujiafan-art/HelloMusic.git
          git push gitcode --force --all
          git push gitcode --force --tags